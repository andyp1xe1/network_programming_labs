[project]
name = "lab1"
version = "0.1.0"
description = "HTTP file server using Python TCP sockets with directory listing and file download capabilities"
readme = "README.md"
authors = [
    { name = "Andrei Chicu", email = "andrei.chicu@isa.utm.md" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lab1 = "lab1:main"
server = "lab1.server:main"
client = "lab1.client:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
