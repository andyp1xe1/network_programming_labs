    container_name: kvstore-follower3
    develop:
      watch:
        - action: rebuild
          path: ./
    ports:
      - "8003:8000"
      - "9003:9000"
    env_file:
      - ".env"
    environment:
      - VERSIONED=${VERSIONED:-0}
    command: ./kvstore -id=kvstore-follower3 -leader=kvstore-leader -rpc-port=:8000 -http-port=:9000
    networks:
      - kvstore-network

  follower4:
    build: .
    container_name: kvstore-follower4
