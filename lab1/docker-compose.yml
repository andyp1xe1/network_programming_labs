services:
  http-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./www:/app/www
    command: ["uv", "run", "server.py", "/app/www", "8080"]
    network_mode: "host"
    
  http-client:
    build: .
    profiles:
      - client
    volumes:
      - ./downloads:/app/downloads
    command: ["uv", "run", "client.py", "localhost", "8080", "index.html"]
    network_mode: "host"
